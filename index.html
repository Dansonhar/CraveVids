<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crave Video Presentations</title>
<meta name="description" content="Product presentations by Crave.">
<link rel="icon" href="assets/crave-logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<link rel="stylesheet" href="styles.css?v=4fa1d4d4">
</head>
<body>

<!-- the product fills the screen; everything else floats over it -->
<main class="stage" id="stage">
  <video id="scrub" class="stage-video" muted playsinline preload="auto"
         disablepictureinpicture aria-label="Exploded view"></video>
  <div class="stage-glow" aria-hidden="true"></div>
</main>

<header class="topbar">
  <div class="brand">
    <img class="brand-logo" src="assets/crave-logo-white.svg" alt="Crave" width="350" height="100">
    <span class="brand-sub">Video Presentations</span>
  </div>
  <h1 class="scene-title" id="scene-title"></h1>
</header>

<!-- left: pick a product -->
<aside class="picker" id="picker" hidden aria-label="Choose a product">
  <div class="picker-list" id="picker-list"></div>
</aside>

<!-- hairline progress along the bottom edge -->
<div class="progress" aria-hidden="true"><span class="progress-fill" id="progress-fill"></span></div>

<section class="blank" id="blank" hidden>
  <h2>No videos yet</h2>
  <p>Drop your files into the <code>videos/</code> folder, then reload.</p>
</section>

<script src="videos.js?v=90a85d34"></script>
<script src="app.js?v=ffb81f39"></script>
</body>
</html>
