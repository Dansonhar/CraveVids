<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CraveAsia Video Presentations</title>
<meta name="description" content="Video presentations by CraveAsia.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23000'/><path d='M13 10l10 6-10 6z' fill='%23fff'/></svg>">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app">

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">&#9654;</span>
      <span class="brand-text">
        <span class="brand-name">CraveAsia</span>
        <span class="brand-sub">Video Presentations</span>
      </span>
    </div>
    <p class="topbar-title" id="scene-eyebrow">Exploded View</p>
  </header>

  <main class="scene" id="scene">

    <!-- left: pick a device -->
    <aside class="picker" id="picker" hidden aria-label="Choose a video">
      <p class="picker-label">Devices</p>
      <div class="picker-list" id="picker-list"></div>
    </aside>

    <!-- centre: the moving device -->
    <div class="stage-col">
      <div class="scene-stage" id="stage">
        <div class="scene-glow" aria-hidden="true"></div>
        <video id="scrub" class="scene-video" muted loop playsinline preload="auto"
               disablepictureinpicture aria-label="Exploded view"></video>
        <div class="scene-scan" aria-hidden="true"></div>
        <button class="stage-toggle" id="toggle" aria-label="Pause">
          <span class="ico-pause" aria-hidden="true"></span>
        </button>
      </div>

      <div class="track" id="track" aria-label="Timeline">
        <div class="track-line"><span class="track-fill" id="track-fill"></span></div>
        <div class="track-ticks" id="track-ticks"></div>
      </div>

      <div class="scene-foot">
        <h1 class="scene-title" id="scene-title"></h1>
        <p class="hint">Drag the device to scrub &middot; click to pause</p>
      </div>
    </div>

    <!-- right: chapter, live -->
    <aside class="caption" id="caption">
      <span class="caption-idx" id="cap-idx"></span>
      <p class="caption-title" id="cap-title"></p>
      <p class="caption-text" id="cap-text"></p>
      <p class="caption-desc" id="cap-desc"></p>
    </aside>

    <section class="blank" id="blank" hidden>
      <h2>No videos yet</h2>
      <p>Drop your files into the <code>videos/</code> folder, then reload.</p>
    </section>

  </main>

  <footer class="foot">
    <span>CraveAsia</span>
    <span class="dim" id="count"></span>
  </footer>

</div>

<script src="videos.js"></script>
<script src="app.js"></script>
</body>
</html>
