<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CraveAsia Video Presentations</title>
<meta name="description" content="Video presentations by CraveAsia.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23000'/><path d='M13 10l10 6-10 6z' fill='%23fff'/></svg>">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <a class="brand" href="./">
    <span class="brand-mark" aria-hidden="true">&#9654;</span>
    <span class="brand-text">
      <span class="brand-name">CraveAsia</span>
      <span class="brand-sub">Video Presentations</span>
    </span>
  </a>
  <input id="search" type="search" placeholder="Search" aria-label="Search videos" autocomplete="off">
</header>

<main class="wrap">
  <div class="grid" id="grid"></div>

  <p class="empty" id="empty" hidden>Nothing matches that search.</p>

  <section class="blank" id="blank" hidden>
    <h1>No videos yet</h1>
    <p>Drop your files into the <code>videos/</code> folder, then reload this page.</p>
    <p class="dim">.mp4 · .webm · .mov · .m4v</p>
  </section>
</main>

<footer class="foot">
  <span>CraveAsia</span>
  <span class="dim" id="count"></span>
</footer>

<div class="modal" id="modal" hidden>
  <div class="modal-backdrop" data-close></div>
  <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="m-title">
    <button class="modal-close" data-close aria-label="Close">&times;</button>
    <div class="stage"><video id="player" playsinline controls preload="metadata"></video></div>
    <div class="modal-meta">
      <h2 id="m-title"></h2>
      <p class="modal-desc" id="m-desc"></p>
      <ul class="notes" id="m-notes"></ul>
    </div>
    <div class="modal-nav">
      <button id="prev">&larr; Previous</button>
      <span class="pos" id="m-pos"></span>
      <button id="next">Next &rarr;</button>
    </div>
  </div>
</div>

<script src="videos.js"></script>
<script src="app.js"></script>
</body>
</html>
