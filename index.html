<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CraveAsia Video Presentations</title>
<meta name="description" content="Video presentations by CraveAsia.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23000'/><path d='M13 10l10 6-10 6z' fill='%23fff'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- the product fills the screen; everything else floats over it -->
<main class="stage" id="stage">
  <video id="scrub" class="stage-video" muted playsinline preload="auto"
         disablepictureinpicture aria-label="Exploded view"></video>
  <div class="stage-glow" aria-hidden="true"></div>
</main>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">&#9654;</span>
    <span class="brand-text">
      <span class="brand-name">CraveAsia</span>
      <span class="brand-sub">Video Presentations</span>
    </span>
  </div>
  <h1 class="scene-title" id="scene-title"></h1>
</header>

<!-- left: pick a product -->
<aside class="picker" id="picker" hidden aria-label="Choose a product">
  <div class="picker-list" id="picker-list"></div>
</aside>

<!-- hairline progress along the bottom edge -->
<div class="progress" aria-hidden="true"><span class="progress-fill" id="progress-fill"></span></div>

<section class="blank" id="blank" hidden>
  <h2>No videos yet</h2>
  <p>Drop your files into the <code>videos/</code> folder, then reload.</p>
</section>

<script src="videos.js"></script>
<script src="app.js"></script>
</body>
</html>
